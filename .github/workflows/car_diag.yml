name: Prueba carteras PROSPEI

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests yfinance
      - run: python car_diag.py
      - name: Guardar
        run: |
          git config user.name "screener-bot"
          git config user.email "screener-bot@users.noreply.github.com"
          git add car_diag.json
          git diff --cached --quiet && exit 0
          git commit -m "Prueba carteras $(date -u +'%Y-%m-%d %H:%M')"
          git pull --rebase
          git push
