name: ONs PROSPEI

on:
  schedule:
    - cron: "41 12 * * 1"   # lunes 9:41 hora Argentina
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ons
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Bajar ONs y flujos
        run: python on_update.py
      - name: Guardar cambios
        run: |
          git config user.name "screener-bot"
          git config user.email "screener-bot@users.noreply.github.com"
          git add ons.json on_debug.json 2>/dev/null || true
          git diff --cached --quiet && echo "Sin cambios" && exit 0
          git commit -m "Actualiza ONs $(date -u +'%Y-%m-%d %H:%M')"
          git pull --rebase
          git push
